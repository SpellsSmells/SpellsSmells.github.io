<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Map Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="main-body">
    <div class="map-section">
        <div class="container">
            <img src="map.png">
            <svg id="map-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
                </svg>
        </div>
    </div>
    <div class="data-section">
        <div id="status-bar">Data updated: <span id="time-ago">Syncing...</span></div>
        <ul id="people-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
